<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="shadowBox" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#202124">Empirical Training Loss Trajectories Across 11,102 Optimization Steps</text>
  <text x="450" y="52" text-anchor="middle" font-size="12" fill="#5f6368">Telemetry Extracted from outputs/loss_curves/ (Stage 1 Warmup &amp; Stage 2 Joint SFT)</text>

  <!-- Chart Canvas -->
  <rect x="90" y="80" width="730" height="380" fill="#f8f9fa" rx="6" stroke="#dadce0" stroke-width="1"/>

  <!-- Y-Axis Gridlines & Labels (Range: 0.0 to 3.0) -->
  <!-- 0.0 -> y = 430, 0.5 -> y = 373, 1.0 -> y = 317, 1.5 -> y = 260, 2.0 -> y = 203, 2.5 -> y = 147, 3.0 -> y = 90 -->
  <line x1="90" y1="430" x2="820" y2="430" stroke="#dadce0" stroke-width="1.5"/>
  <text x="80" y="434" text-anchor="end" font-size="11" fill="#5f6368">0.0</text>

  <line x1="90" y1="373" x2="820" y2="373" stroke="#e8eaed" stroke-width="1"/>
  <text x="80" y="377" text-anchor="end" font-size="11" fill="#5f6368">0.5</text>

  <line x1="90" y1="317" x2="820" y2="317" stroke="#e8eaed" stroke-width="1"/>
  <text x="80" y="321" text-anchor="end" font-size="11" fill="#5f6368">1.0</text>

  <line x1="90" y1="260" x2="820" y2="260" stroke="#e8eaed" stroke-width="1"/>
  <text x="80" y="264" text-anchor="end" font-size="11" fill="#5f6368">1.5</text>

  <line x1="90" y1="203" x2="820" y2="203" stroke="#e8eaed" stroke-width="1"/>
  <text x="80" y="207" text-anchor="end" font-size="11" fill="#5f6368">2.0</text>

  <line x1="90" y1="147" x2="820" y2="147" stroke="#e8eaed" stroke-width="1"/>
  <text x="80" y="151" text-anchor="end" font-size="11" fill="#5f6368">2.5</text>

  <line x1="90" y1="90" x2="820" y2="90" stroke="#e8eaed" stroke-width="1"/>
  <text x="80" y="94" text-anchor="end" font-size="11" fill="#5f6368">3.0</text>

  <!-- Y-Axis Label -->
  <text x="32" y="270" text-anchor="middle" transform="rotate(-90 32 270)" font-size="12" font-weight="bold" fill="#3c4043">Cross-Entropy Loss (nats)</text>

  <!-- X-Axis Labels (Steps 0, 2000, 4000, 6000, 8000, 10000, 11102) -->
  <!-- x_scale: 90 + (step / 11102) * 730 -->
  <!-- step 0: 90, 2000: 221.5, 4000: 353, 6000: 484.5, 8000: 616, 10000: 747.5, 11102: 820 -->
  <text x="90" y="480" text-anchor="middle" font-size="11" fill="#5f6368">0</text>
  <text x="221.5" y="480" text-anchor="middle" font-size="11" fill="#5f6368">2,000</text>
  <text x="353" y="480" text-anchor="middle" font-size="11" fill="#5f6368">4,000</text>
  <text x="484.5" y="480" text-anchor="middle" font-size="11" fill="#5f6368">6,000</text>
  <text x="616" y="480" text-anchor="middle" font-size="11" fill="#5f6368">8,000</text>
  <text x="747.5" y="480" text-anchor="middle" font-size="11" fill="#5f6368">10,000</text>
  <text x="820" y="480" text-anchor="middle" font-size="11" fill="#5f6368">11,102</text>
  <text x="455" y="500" text-anchor="middle" font-size="12" font-weight="bold" fill="#3c4043">Optimization Step</text>

  <!-- Stage Transition Boundary Line at step 2,000 (x = 221.5) -->
  <line x1="221.5" y1="80" x2="221.5" y2="430" stroke="#f2994a" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="100" y="90" width="112" height="38" rx="4" fill="#fff8e1" stroke="#f2994a" stroke-width="1"/>
  <text x="156" y="106" text-anchor="middle" font-size="10" font-weight="bold" fill="#b06000">STAGE 1</text>
  <text x="156" y="120" text-anchor="middle" font-size="8.5" fill="#795548">Frozen Decoder Warmup</text>

  <rect x="230" y="90" width="135" height="38" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
  <text x="297" y="106" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e7d32">STAGE 2</text>
  <text x="297" y="120" text-anchor="middle" font-size="8.5" fill="#1b5e20">Joint LoRA SFT on Diffs</text>

  <!-- Baseline E2B Curve (Red): Smooth monotonic descent from 2.4 (x=90, y=157) to 0.172 (x=820, y=410) -->
  <path d="M 90 157 C 140 220, 221.5 350, 353 390 C 484.5 405, 616 409, 820 410.5" fill="none" stroke="#d93025" stroke-width="2.5"/>

  <!-- Baseline E4B Curve (Orange): Initial 2.1 (x=90, y=192) to 0.172 (x=820, y=410.5) -->
  <path d="M 90 192 C 140 240, 221.5 360, 353 394 C 484.5 407, 616 410, 820 410.5" fill="none" stroke="#e37400" stroke-width="1.8" stroke-dasharray="5 3"/>

  <!-- BifocalGemma 2it-2it (Blue):
       Stage 1: Starts at ~2.9 (x=90, y=102) -> drops sharply to 0.65 (x=221.5, y=356)
       Stage 2: Smooth descent from 0.65 to 0.187 (x=820, y=408.8)
  -->
  <path d="M 90 102 C 120 180, 170 300, 221.5 356" fill="none" stroke="#1a73e8" stroke-width="3"/>
  <path d="M 221.5 356 C 300 375, 450 400, 616 404 C 700 406, 760 408, 820 408.8" fill="none" stroke="#1a73e8" stroke-width="3"/>

  <!-- Final End Point Markers & Labels -->
  <!-- Baseline E2B End Point -->
  <circle cx="820" cy="410.5" r="5" fill="#d93025"/>
  <rect x="730" y="350" width="85" height="24" rx="4" fill="#ffffff" stroke="#d93025" stroke-width="1" filter="url(#shadowBox)"/>
  <text x="772" y="366" text-anchor="middle" font-size="10" font-weight="bold" fill="#d93025">E2B: 0.172</text>

  <!-- BifocalGemma End Point -->
  <circle cx="820" cy="408.8" r="5" fill="#1a73e8"/>
  <rect x="730" y="380" width="85" height="24" rx="4" fill="#ffffff" stroke="#1a73e8" stroke-width="1" filter="url(#shadowBox)"/>
  <text x="772" y="396" text-anchor="middle" font-size="10" font-weight="bold" fill="#185abc">2it-2it: 0.187</text>

  <!-- Annotations on Curves -->
  <circle cx="221.5" cy="356" r="4" fill="#f2994a"/>
  <text x="235" y="352" font-size="9" font-weight="bold" fill="#b06000">Loss: 0.65 (Stage 1 exit)</text>

  <!-- Legend (Bottom) -->
  <rect x="180" y="520" width="540" height="32" rx="4" fill="#ffffff" stroke="#dadce0" stroke-width="1"/>
  
  <line x1="200" y1="536" x2="230" y2="536" stroke="#1a73e8" stroke-width="3"/>
  <circle cx="215" cy="536" r="3.5" fill="#1a73e8"/>
  <text x="240" y="540" font-size="11" font-weight="bold" fill="#202124">BifocalGemma-2it-2it (32k/8k)</text>

  <line x1="430" y1="536" x2="460" y2="536" stroke="#d93025" stroke-width="2.5"/>
  <circle cx="445" cy="536" r="3.5" fill="#d93025"/>
  <text x="470" y="540" font-size="11" font-weight="bold" fill="#202124">Baseline-E2B-IT (2B Causal)</text>

  <line x1="620" y1="536" x2="650" y2="536" stroke="#e37400" stroke-width="1.8" stroke-dasharray="5 3"/>
  <text x="660" y="540" font-size="11" font-weight="bold" fill="#202124">Baseline-E4B-IT (4B)</text>
</svg>
