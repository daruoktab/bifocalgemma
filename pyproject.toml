[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bifocalgemma"
version = "0.1.0"
description = "BifocalGemma research scaffold: merged base-encoder / IT-decoder code repair"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "daruoktab" },
    { name = "attmhd" }
]
keywords = ["gemma4", "coding-agent", "long-context", "encoder-decoder", "swe-bench", "kaggle", "code-comprehension"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch==2.14.1",
    "safetensors==0.8.0",
    "transformers==5.19.0",
    "huggingface-hub==1.33.0",
    "tokenizers==0.23.2",
    "pyarrow==25.0.1",
    "numpy==2.5.3",
    "accelerate==1.15.0",
    "peft>=0.14.0",
    "datasets>=3.0.0",
    "einops>=0.8.0",
]

[project.optional-dependencies]
notebook = ["marimo==0.25.1", "pytest==8.4.2"]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
    "ty>=0.0.84",
]

[project.scripts]
bifocalgemma = "bifocalgemma.__main__:main"

[project.urls]
Homepage = "https://github.com/daruoktab/bifocalgemma"
Repository = "https://github.com/daruoktab/bifocalgemma"
Issues = "https://github.com/daruoktab/bifocalgemma/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["bifocalgemma*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.setuptools.package-data]
bifocalgemma = ["assets/*.json"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
