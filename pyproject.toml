[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bifocalgemma"
version = "0.1.0"
description = "BifocalGemma research scaffold: merged base-encoder / IT-decoder code repair"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "daruoktab" },
    { name = "attmhd" }
]
keywords = ["gemma4", "coding-agent", "long-context", "encoder-decoder", "swe-bench", "kaggle", "code-comprehension"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch==2.15.0",
    "torchvision==0.29.2",
    "safetensors==0.8.0",
    "transformers>=5.22.1,<=5.22.2",
    "huggingface-hub==2.4.0",
    "tokenizers==0.23.3",
    "pyarrow==26.0.0",
    "numpy==2.5.4",
    "PyYAML==6.0.3",
    "accelerate==1.15.0",
    "peft==0.21.2",
    "datasets>=5.1.0,<=5.2.0",
    "einops>=0.8.0",
]

[project.optional-dependencies]
notebook = ["marimo==0.25.2", "pytest==9.2.0", "wigglystuff>=0.5.36,<=0.5.37"]
gpu-kernels = [
    "triton-windows==3.9.0.post30; sys_platform == 'win32'",
    "triton==3.9.0; sys_platform == 'linux'",
]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "ty>=0.0.100",
    "pyrefly>=1.4.1",
    "types-PyYAML>=6.0.12.20260906",
    "types-psutil>=7.2.2.20260906",
]

[project.scripts]
bifocalgemma = "bifocalgemma.__main__:main"

[project.urls]
Homepage = "https://github.com/daruoktab/bifocalgemma"
Repository = "https://github.com/daruoktab/bifocalgemma"
Issues = "https://github.com/daruoktab/bifocalgemma/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["bifocalgemma*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".agents", ".codex"]

[tool.pyrefly]
project-includes = ["src/**/*.py", "tools/**/*.py", "tests/**/*.py"]
search-path = ["src", "tools", "."]
python-interpreter-path = "C:/Users/daru/miniconda3/envs/ai/python.exe"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Exported cells intentionally verify dependency/auth gates before native imports.
"notebooks/bifocalgemma_train_*.ipynb" = ["E402"]
"notebooks/legacy/bifocalgemma_train_*.ipynb" = ["E402"]

[tool.setuptools.package-data]
bifocalgemma = ["assets/*.json"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu132", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu132", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchaudio = [{ index = "pytorch-cu132", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests", "tests_e2e"]
pythonpath = ["src"]
