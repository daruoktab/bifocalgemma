[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "janus-4"
version = "0.1.0"
description = "JANUS-4: Asymmetric Bidirectional Encoding & Causal Generation with Encoder-Free Gemma 4 for Multimodal Developer Agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "daruoktab" }
]
keywords = ["gemma4", "multimodal", "developer-agent", "encoder-decoder", "swe-bench", "kaggle"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.4.0",
    "transformers>=4.48.0",
    "accelerate>=1.0.0",
    "peft>=0.14.0",
    "datasets>=3.0.0",
    "einops>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
