[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bifocalgemma"
version = "0.1.0"
description = "BifocalGemma: Evaluating Bidirectional Repository Encoding for Local Code Repair"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "daruoktab" },
    { name = "attmhd" }
]
keywords = ["gemma4", "coding-agent", "long-context", "encoder-decoder", "swe-bench", "kaggle", "code-comprehension"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.4.0",
    "transformers>=5.18.0,<6",
    "accelerate>=1.0.0",
    "peft>=0.14.0",
    "datasets>=3.0.0",
    "einops>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/daruoktab/bifocalgemma"
Repository = "https://github.com/daruoktab/bifocalgemma"
Issues = "https://github.com/daruoktab/bifocalgemma/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["bifocalgemma*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
